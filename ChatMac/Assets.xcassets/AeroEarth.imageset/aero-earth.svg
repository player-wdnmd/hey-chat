<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9ADFFF"/>
      <stop offset="0.42" stop-color="#6EC8F5"/>
      <stop offset="0.72" stop-color="#8BE0C2"/>
      <stop offset="1" stop-color="#C9F3DF"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1280 160) rotate(90) scale(260)">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FFF4B8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF4B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globeBody" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 520) rotate(90) scale(390 390)">
      <stop offset="0" stop-color="#8FE8FF"/>
      <stop offset="0.35" stop-color="#3DB4F0"/>
      <stop offset="0.7" stop-color="#1F86D0"/>
      <stop offset="1" stop-color="#0E5F9E"/>
    </radialGradient>
    <radialGradient id="globeShade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 620) rotate(90) scale(340 340)">
      <stop stop-color="#041E38" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#041E38" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#041E38" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="globeShine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(780 360) rotate(90) scale(220 180)">
      <stop stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land" x1="700" y1="300" x2="1150" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9AF0C0"/>
      <stop offset="0.45" stop-color="#4FD48E"/>
      <stop offset="1" stop-color="#2EA86B"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#E8F8FF" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="cloudBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="globeClip">
      <circle cx="920" cy="520" r="360"/>
    </clipPath>
  </defs>

  <!-- sky board -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1280" cy="160" r="260" fill="url(#sun)"/>

  <!-- distant soft orbs -->
  <circle cx="220" cy="180" r="90" fill="#FFFFFF" opacity="0.18" filter="url(#softBlur)"/>
  <circle cx="380" cy="760" r="120" fill="#FFFFFF" opacity="0.14" filter="url(#softBlur)"/>
  <circle cx="1400" cy="780" r="140" fill="#B8F5D8" opacity="0.22" filter="url(#softBlur)"/>

  <!-- earth shadow on board -->
  <ellipse cx="920" cy="900" rx="300" ry="36" fill="#0B4C7A" opacity="0.18" filter="url(#softBlur)"/>

  <!-- earth -->
  <g>
    <circle cx="920" cy="520" r="360" fill="url(#globeBody)"/>
    <g clip-path="url(#globeClip)">
      <!-- stylized continents -->
      <path d="M760 360c40-46 98-70 150-62 36 6 62 28 86 52 22 22 58 34 86 18 24-14 54-8 72 14 20 24 18 62-2 88-16 22-18 54 0 76 20 24 18 66-8 86-24 18-60 16-86 4-30-14-66-8-90 12-28 24-72 28-106 8-30-18-70-16-96 6-28 24-74 20-98-8-20-24-14-62 10-82 20-16 28-46 18-72-12-30 2-68 34-90 18-12 44-22 70-34z" fill="url(#land)" opacity="0.92"/>
      <path d="M700 560c28-18 66-16 90 4 22 18 56 20 82 6 24-12 54-8 72 10 22 22 58 26 86 10 20-12 48-8 64 10 18 20 14 52-8 68-26 18-62 14-88-2-28-18-66-14-92 6-24 18-60 20-88 4-30-16-68-10-90 14-18 20-52 18-72-2-16-16-14-44 4-60 20-18 34-48 20-74-8-14-20-22-40-20-8 0-16 4-20 10-8 12-4 30 8 38z" fill="url(#land)" opacity="0.88"/>
      <path d="M1080 300c24-10 54-4 70 16 14 18 40 24 62 14 18-8 40-2 50 16 12 20 4 48-16 60-22 14-50 10-70-4-18-14-46-14-66 0-22 16-56 12-74-8-14-16-10-42 8-54 20-14 28-36 16-56-4-8 2-18 12-22 4-1 6 0 8 2z" fill="url(#land)" opacity="0.8"/>
      <path d="M820 700c34-8 70 6 90 34 16 22 48 30 74 18 22-10 50-4 64 16 16 22 8 56-16 70-28 16-64 8-88-12-22-18-56-18-82 0-28 18-68 12-88-14-16-20-10-52 12-68 24-18 28-48 12-74-6-10 0-24 12-28 4-1 7 0 10 2z" fill="url(#land)" opacity="0.78"/>

      <!-- soft clouds -->
      <g opacity="0.55" filter="url(#cloudBlur)" fill="url(#cloud)">
        <ellipse cx="780" cy="430" rx="70" ry="24"/>
        <ellipse cx="830" cy="420" rx="48" ry="18"/>
        <ellipse cx="1040" cy="500" rx="90" ry="28"/>
        <ellipse cx="1100" cy="490" rx="54" ry="18"/>
        <ellipse cx="900" cy="640" rx="80" ry="22"/>
        <ellipse cx="860" cy="650" rx="40" ry="14"/>
      </g>

      <!-- terminator / glossy shade -->
      <circle cx="920" cy="520" r="360" fill="url(#globeShade)"/>
      <ellipse cx="800" cy="390" rx="150" ry="100" fill="url(#globeShine)"/>
    </g>

    <!-- glass rim -->
    <circle cx="920" cy="520" r="360" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6"/>
    <circle cx="920" cy="520" r="352" fill="none" stroke="#7EE7FF" stroke-opacity="0.25" stroke-width="10"/>
    <!-- outer glow ring -->
    <circle cx="920" cy="520" r="376" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="18"/>
  </g>

  <!-- floating glass bubbles -->
  <g opacity="0.55">
    <circle cx="260" cy="420" r="34" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-opacity="0.45"/>
    <circle cx="248" cy="408" r="10" fill="#FFFFFF" fill-opacity="0.55"/>
    <circle cx="1420" cy="420" r="46" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-opacity="0.4"/>
    <circle cx="1404" cy="404" r="12" fill="#FFFFFF" fill-opacity="0.5"/>
    <circle cx="480" cy="220" r="22" fill="#FFFFFF" fill-opacity="0.22" stroke="#FFFFFF" stroke-opacity="0.4"/>
    <circle cx="472" cy="212" r="6" fill="#FFFFFF" fill-opacity="0.55"/>
  </g>
</svg>
